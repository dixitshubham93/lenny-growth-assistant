# ─────────────────────────────────────────────────────────────────────────────
# Lenny Growth Assistant — Docker Compose
#
# Services:
#   postgres  — pgvector-enabled PostgreSQL (pgvector/pgvector:pg16)
#   backend   — FastAPI + Alembic migrations
#   frontend  — Nginx serving static chat UI
#
# Ollama runs on the HOST (not in Docker).
#   Mac/Windows: host.docker.internal resolves automatically.
#   Linux:       extra_hosts maps host.docker.internal → host-gateway.
#
# Quick start:
#   1. cp .env.example .env     (fill in GROQ_API_KEY if using Groq)
#   2. docker compose up --build
#   3. Open http://localhost:3000
# ─────────────────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL + pgvector ──────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-lenny_db}
      POSTGRES_USER:     ${POSTGRES_USER:-lenny}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lenny} -d ${POSTGRES_DB:-lenny_db}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── FastAPI backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      # Database — points to the postgres service (not localhost)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lenny}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-lenny_db}
      # LLM
      LLM_PROVIDER:          ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL:       "http://host.docker.internal:11434"
      OLLAMA_MODEL:          ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}
      # Cloud LLM (optional)
      GROQ_API_KEY:          ${GROQ_API_KEY:-}
      GROQ_MODEL:            ${GROQ_MODEL:-}
      # Embeddings
      EMBEDDING_MODEL:       ${EMBEDDING_MODEL:-nomic-embed-text}
      # Agent
      AGENT_PROVIDER:        ${AGENT_PROVIDER:-internal}
      ANTHROPIC_API_KEY:     ${ANTHROPIC_API_KEY:-}
      RAG_TOP_K:             ${RAG_TOP_K:-5}
      # App
      APP_ENV:               ${APP_ENV:-production}
      LOG_LEVEL:             ${LOG_LEVEL:-INFO}
      CORS_ORIGINS:          http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # Allows backend container to reach Ollama on the host (Linux)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Frontend (Nginx + static HTML) ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
