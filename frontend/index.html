<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lenny Growth Assistant</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #232635;
      --border: #2e3148;
      --accent: #6c63ff;
      --accent2: #4ecdc4;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --user-bubble: #6c63ff;
      --ai-bubble: #1e2235;
      --source-bg: #141721;
      --artifact-bg: #0d1117;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ─── Header ─────────────────────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    header h1 { font-size: 1.1rem; font-weight: 700; color: var(--text); }
    header h1 span { color: var(--accent); }
    #provider-badge {
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    /* ─── Main layout ────────────────────────────────────────────────────── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ─── Sidebar ────────────────────────────────────────────────────────── */
    .sidebar {
      width: 220px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }
    #new-session-btn {
      width: 100%;
      padding: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }
    #new-session-btn:hover { opacity: 0.9; }
    #session-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .session-item {
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .session-item.active { background: var(--surface2); color: var(--text); }
    .session-item:hover { background: var(--surface2); }

    /* ─── Chat panel ─────────────────────────────────────────────────────── */
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg { display: flex; flex-direction: column; max-width: 80%; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 0.9rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .bubble { background: var(--user-bubble); color: #fff; border-radius: 12px 12px 2px 12px; }
    .msg.assistant .bubble { background: var(--ai-bubble); border: 1px solid var(--border); border-radius: 12px 12px 12px 2px; }

    /* skill badge */
    .skill-badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 10px;
      margin-top: 4px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--accent2);
    }

    /* sources */
    .sources { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .source-chip {
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--source-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: default;
    }
    .source-chip:hover { color: var(--accent2); border-color: var(--accent2); }

    /* artifact open button */
    .artifact-btn {
      margin-top: 8px;
      padding: 5px 12px;
      font-size: 0.78rem;
      background: transparent;
      border: 1px solid var(--accent2);
      color: var(--accent2);
      border-radius: 4px;
      cursor: pointer;
    }
    .artifact-btn:hover { background: var(--accent2); color: #000; }

    /* input area */
    .input-area {
      border-top: 1px solid var(--border);
      padding: 14px 20px;
      background: var(--surface);
      display: flex;
      gap: 10px;
    }
    #msg-input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 0.9rem;
      resize: none;
      height: 42px;
      max-height: 120px;
      overflow-y: auto;
    }
    #msg-input:focus { outline: none; border-color: var(--accent); }
    #send-btn {
      padding: 0 20px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 600;
    }
    #send-btn:hover { opacity: 0.9; }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ─── Artifact panel ─────────────────────────────────────────────────── */
    .artifact-panel {
      width: 420px;
      background: var(--artifact-bg);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .hidden { display: none !important; }
    .artifact-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    #close-artifact {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
    }
    #artifact-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    /* Rendered Markdown */
    #artifact-content h1, #artifact-content h2, #artifact-content h3 {
      color: var(--text); margin: 16px 0 8px; line-height: 1.3;
    }
    #artifact-content p { margin-bottom: 12px; line-height: 1.7; color: var(--text); font-size: 0.9rem; }
    #artifact-content ul, #artifact-content ol { margin: 8px 0 12px 20px; font-size: 0.9rem; }
    #artifact-content li { margin-bottom: 4px; color: var(--text); }
    #artifact-content strong { color: var(--accent2); }
    #artifact-content hr { border-color: var(--border); margin: 20px 0; }
    /* Sandboxed HTML artifact */
    #artifact-iframe {
      width: 100%;
      flex: 1;
      border: none;
      background: #fff;
    }

    /* ─── Loading ────────────────────────────────────────────────────────── */
    .loading-dots span {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      margin: 0 2px;
      animation: bounce 1.2s infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }

    #status-bar {
      font-size: 0.75rem;
      color: var(--text-muted);
      padding: 4px 20px 0;
      min-height: 18px;
    }
  </style>
</head>
<body>

<header>
  <h1><span>Lenny</span> Growth Assistant</h1>
  <span id="provider-badge">loading...</span>
</header>

<div class="main">

  <!-- Sidebar: sessions -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <button id="new-session-btn">+ New Chat</button>
    </div>
    <div id="session-list"></div>
  </aside>

  <!-- Chat panel -->
  <section class="chat-panel">
    <div id="messages"></div>
    <div id="status-bar"></div>
    <div class="input-area">
      <textarea id="msg-input" placeholder="Ask about product strategy, growth, or type 'ship30: [topic]' for an essay..." rows="1"></textarea>
      <button id="send-btn">Send</button>
    </div>
  </section>

  <!-- Artifact viewer -->
  <aside class="artifact-panel hidden" id="artifact-panel">
    <div class="artifact-header">
      <span id="artifact-title">📄 Artifact</span>
      <button id="close-artifact" title="Close">✕</button>
    </div>
    <div id="artifact-content"></div>
    <iframe id="artifact-iframe" class="hidden"
      sandbox="allow-same-origin"
      title="Generated HTML artifact (sandboxed — no scripts allowed)">
    </iframe>
  </aside>

</div>

<script>
  // ─── State ─────────────────────────────────────────────────────────────────
  const API = '/api/v1';
  let currentSessionId = null;
  let sessions = [];

  // ─── DOM refs ──────────────────────────────────────────────────────────────
  const messagesEl   = document.getElementById('messages');
  const msgInput     = document.getElementById('msg-input');
  const sendBtn      = document.getElementById('send-btn');
  const sessionList  = document.getElementById('session-list');
  const newSessionBtn= document.getElementById('new-session-btn');
  const providerBadge= document.getElementById('provider-badge');
  const artifactPanel= document.getElementById('artifact-panel');
  const artifactContent = document.getElementById('artifact-content');
  const artifactIframe  = document.getElementById('artifact-iframe');
  const artifactTitle   = document.getElementById('artifact-title');
  const statusBar    = document.getElementById('status-bar');

  // ─── Health / provider check ────────────────────────────────────────────────
  async function checkHealth() {
    try {
      const r = await fetch(`${API}/health`);
      if (!r.ok) return;
      const d = await r.json();
      const provider = d.provider || 'unknown';
      const model    = d.model || '';
      providerBadge.textContent = `${provider} · ${model}`;
    } catch (e) {
      providerBadge.textContent = 'backend offline';
    }
  }

  // ─── Sessions ───────────────────────────────────────────────────────────────
  async function createSession() {
    const r = await fetch(`${API}/sessions`, { method: 'POST' });
    const d = await r.json();
    const sid = d.session_id;
    sessions.unshift({ id: sid, created: new Date() });
    renderSessionList();
    switchSession(sid);
    return sid;
  }

  function renderSessionList() {
    sessionList.innerHTML = '';
    sessions.forEach((s, i) => {
      const el = document.createElement('div');
      el.className = 'session-item' + (s.id === currentSessionId ? ' active' : '');
      el.textContent = `Chat ${sessions.length - i}`;
      el.title = s.id;
      el.onclick = () => switchSession(s.id);
      sessionList.appendChild(el);
    });
  }

  async function switchSession(sid) {
    currentSessionId = sid;
    renderSessionList();
    messagesEl.innerHTML = '';
    closeArtifact();
    // Load existing messages
    try {
      const r = await fetch(`${API}/sessions/${sid}/messages`);
      if (!r.ok) return;
      const d = await r.json();
      d.messages.forEach(m => renderMessage(m.role, m.content, m.sources || []));
    } catch (e) { /* no history */ }
  }

  // ─── Render message ─────────────────────────────────────────────────────────
  function renderMessage(role, content, sources = [], skillUsed = null, artifact = null) {
    const wrapper = document.createElement('div');
    wrapper.className = `msg ${role}`;

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    // For assistant messages, try to render Markdown
    if (role === 'assistant' && window.marked) {
      bubble.innerHTML = window.marked.parse(content);
    } else {
      bubble.textContent = content;
    }
    wrapper.appendChild(bubble);

    if (role === 'assistant') {
      // skill badge
      if (skillUsed) {
        const badge = document.createElement('div');
        badge.className = 'skill-badge';
        badge.textContent = skillUsed === 'ship30' ? '✍️ Ship 30 for 30' : '🔍 Grounded QA';
        wrapper.appendChild(badge);
      }

      // source chips
      if (sources && sources.length > 0) {
        const sourcesEl = document.createElement('div');
        sourcesEl.className = 'sources';
        sources.forEach(s => {
          const chip = document.createElement('span');
          chip.className = 'source-chip';
          const label = s.title || s.episode_id || s.chunk_id;
          chip.textContent = `📖 ${label}`;
          chip.title = `Distance: ${s.cosine_distance?.toFixed(3) || 'n/a'} | ${s.source_file || ''}`;
          sourcesEl.appendChild(chip);
        });
        wrapper.appendChild(sourcesEl);
      }

      // artifact button
      if (artifact) {
        const btn = document.createElement('button');
        btn.className = 'artifact-btn';
        btn.textContent = '📄 View Essay Artifact';
        btn.onclick = () => showArtifact(artifact, skillUsed);
        wrapper.appendChild(btn);
      }
    }

    messagesEl.appendChild(wrapper);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return wrapper;
  }

  // ─── Artifact viewer ────────────────────────────────────────────────────────
  function showArtifact(content, skill) {
    artifactPanel.classList.remove('hidden');

    const isHtml = content.trim().startsWith('<');
    artifactTitle.textContent = skill === 'ship30' ? '✍️ Ship 30 Essay' : '📄 Artifact';

    if (isHtml) {
      // Sandboxed iframe — no scripts, no forms, no popups
      // sandbox="allow-same-origin" only — scripts are blocked by default
      artifactContent.classList.add('hidden');
      artifactContent.innerHTML = '';
      artifactIframe.classList.remove('hidden');
      artifactIframe.srcdoc = content;
      artifactIframe.style.display = 'block';
      artifactIframe.style.height = '100%';
    } else {
      // Markdown
      artifactIframe.classList.add('hidden');
      artifactIframe.srcdoc = '';
      artifactContent.classList.remove('hidden');
      artifactContent.innerHTML = window.marked ? window.marked.parse(content) : content;
    }
  }

  function closeArtifact() {
    artifactPanel.classList.add('hidden');
    artifactContent.innerHTML = '';
    artifactIframe.srcdoc = '';
  }

  document.getElementById('close-artifact').onclick = closeArtifact;

  // ─── Send message ────────────────────────────────────────────────────────────
  async function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || !currentSessionId) return;

    msgInput.value = '';
    msgInput.style.height = '42px';
    sendBtn.disabled = true;

    renderMessage('user', text);

    // Loading indicator
    const loadingEl = document.createElement('div');
    loadingEl.className = 'msg assistant';
    loadingEl.innerHTML = '<div class="bubble"><div class="loading-dots"><span></span><span></span><span></span></div></div>';
    messagesEl.appendChild(loadingEl);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    statusBar.textContent = 'Thinking...';

    try {
      const r = await fetch(`${API}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: currentSessionId }),
      });

      loadingEl.remove();

      if (!r.ok) {
        const err = await r.json().catch(() => ({}));
        renderMessage('assistant', `⚠️ Error: ${err?.error?.message || r.statusText}`);
        return;
      }

      const d = await r.json();

      renderMessage('assistant', d.answer, d.sources || [], d.skill_used, d.artifact);

      // Update provider badge live
      if (d.provider && d.model) {
        providerBadge.textContent = `${d.provider} · ${d.model}`;
      }

      // Auto-open artifact
      if (d.artifact) {
        showArtifact(d.artifact, d.skill_used);
      }

      statusBar.textContent = d.retrieval_count > 0
        ? `${d.retrieval_count} source(s) · ${d.latency_ms}ms`
        : `${d.latency_ms}ms`;

    } catch (e) {
      loadingEl.remove();
      renderMessage('assistant', `⚠️ Network error: ${e.message}`);
    } finally {
      sendBtn.disabled = false;
      msgInput.focus();
    }
  }

  // ─── Event listeners ────────────────────────────────────────────────────────
  sendBtn.onclick = sendMessage;

  msgInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  msgInput.addEventListener('input', () => {
    msgInput.style.height = '42px';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
  });

  newSessionBtn.onclick = () => createSession();

  // ─── Init ────────────────────────────────────────────────────────────────────
  (async function init() {
    await checkHealth();
    await createSession();
  })();
</script>
</body>
</html>
