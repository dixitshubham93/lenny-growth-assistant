<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lenny Growth Assistant</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #232635;
      --border: #2e3148;
      --accent: #6c63ff;
      --accent2: #4ecdc4;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --user-bubble: #6c63ff;
      --ai-bubble: #1e2235;
      --source-bg: #141721;
      --artifact-bg: #0d1117;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ─── Header ─────────────────────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    header h1 { font-size: 1.1rem; font-weight: 700; color: var(--text); }
    header h1 span { color: var(--accent); }
    #provider-badge {
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    /* ─── Main layout ────────────────────────────────────────────────────── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ─── Sidebar ────────────────────────────────────────────────────────── */
    .sidebar {
      width: 220px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }
    #new-session-btn {
      width: 100%;
      padding: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }
    #new-session-btn:hover { opacity: 0.9; }
    #session-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .session-item {
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .session-item .session-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .delete-session-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.2s, color 0.2s;
    }
    .session-item:hover .delete-session-btn { opacity: 1; }
    .delete-session-btn:hover { color: #ef4444; }
    .session-item.active { background: var(--surface2); color: var(--text); }
    .session-item:hover { background: var(--surface2); }

    /* ─── Chat panel ─────────────────────────────────────────────────────── */
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg { display: flex; flex-direction: column; max-width: 80%; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 0.9rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .bubble { background: var(--user-bubble); color: #fff; border-radius: 12px 12px 2px 12px; }
    .msg.assistant .bubble { background: var(--ai-bubble); border: 1px solid var(--border); border-radius: 12px 12px 12px 2px; }

    /* skill badge */
    .skill-badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 10px;
      margin-top: 4px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--accent2);
    }

    /* sources */
    .sources { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .source-chip {
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--source-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: default;
    }
    .source-chip:hover { color: var(--accent2); border-color: var(--accent2); }

    /* artifact open button */
    .artifact-btn {
      margin-top: 8px;
      padding: 5px 12px;
      font-size: 0.78rem;
      background: transparent;
      border: 1px solid var(--accent2);
      color: var(--accent2);
      border-radius: 4px;
      cursor: pointer;
    }
    .artifact-btn:hover { background: var(--accent2); color: #000; }

    /* input area */
    .input-area {
      border-top: 1px solid var(--border);
      padding: 14px 20px;
      background: var(--surface);
      display: flex;
      gap: 10px;
    }
    #msg-input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 0.9rem;
      resize: none;
      height: 42px;
      max-height: 120px;
      overflow-y: auto;
    }
    #msg-input:focus { outline: none; border-color: var(--accent); }
    #send-btn {
      padding: 0 20px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 600;
    }
    #send-btn:hover { opacity: 0.9; }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ─── Artifact panel ─────────────────────────────────────────────────── */
    .artifact-panel {
      width: 720px;
      background: var(--artifact-bg);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.2s ease;
    }
    .hidden { display: none !important; }

    .artifact-header {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      background: var(--surface);
    }
    .artifact-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .artifact-icon { font-size: 1rem; }
    #artifact-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text);
    }
    .viewer-tabs {
      display: flex;
      gap: 12px;
      margin-left: 20px;
    }
    .viewer-tab {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 0;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .viewer-tab:hover { color: var(--text); }
    .viewer-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .artifact-format-badge {
      font-size: 0.65rem;
      padding: 2px 7px;
      border-radius: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--accent2);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    #close-artifact {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      transition: color 0.15s;
    }
    #close-artifact:hover { color: var(--text); }

    /* Tabbed body */
    .artifact-body {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    .artifact-content-panel {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      transition: opacity 0.2s, visibility 0.2s;
    }
    .artifact-content-panel.hidden-tab {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Source code view */
    #artifact-source {
      flex: 1;
      overflow-y: auto;
      margin: 0;
      padding: 16px;
      font-family: 'Consolas', 'Menlo', 'Monaco', monospace;
      font-size: 0.72rem;
      line-height: 1.65;
      color: #a8b8ce;
      background: var(--artifact-bg);
      white-space: pre-wrap;
      word-break: break-all;
    }
    /* Preview iframe */
    #artifact-preview-wrap {
      flex: 1;
      overflow: hidden;
      background: #fff;
      position: relative;
    }
    #artifact-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* States */
    .artifact-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .artifact-state .state-icon { font-size: 2rem; }
    .artifact-state.error { color: #ef4444; }
    .artifact-loading-bar {
      width: 80px;
      height: 3px;
      background: var(--surface2);
      border-radius: 2px;
      overflow: hidden;
    }
    .artifact-loading-bar::after {
      content: '';
      display: block;
      height: 100%;
      width: 40%;
      background: var(--accent);
      border-radius: 2px;
      animation: slide 1s ease-in-out infinite alternate;
    }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(150%); } }

    /* ─── Artifact action buttons ─────────────────────────────────────── */
    .artifact-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .artifact-action-btn {
      padding: 4px 10px;
      font-size: 0.72rem;
      font-weight: 600;
      border-radius: 5px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-muted);
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .artifact-action-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .artifact-action-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .copy-confirm {
      font-size: 0.72rem;
      color: var(--accent2);
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .copy-confirm.visible { opacity: 1; }

    /* ─── Loading ────────────────────────────────────────────────────────── */
    .loading-dots span {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      margin: 0 2px;
      animation: bounce 1.2s infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }

    #status-bar {
      font-size: 0.75rem;
      color: var(--text-muted);
      padding: 4px 20px 0;
      min-height: 18px;
    }
  </style>
</head>
<body>

<header>
  <h1><span>Lenny</span> Growth Assistant</h1>
  <span id="provider-badge">loading...</span>
</header>

<div class="main">

  <!-- Sidebar: sessions -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <button id="new-session-btn">+ New Chat</button>
    </div>
    <div id="session-list"></div>
  </aside>

  <!-- Chat panel -->
  <section class="chat-panel">
    <div id="messages"></div>
    <div id="status-bar"></div>
    <div class="input-area">
      <textarea id="msg-input" placeholder="Ask about product strategy, growth, or type 'ship30: [topic]' for an essay..." rows="1"></textarea>
      <button id="send-btn">Send</button>
    </div>
  </section>

  <!-- Artifact viewer (Source | Preview split) -->
  <aside class="artifact-panel hidden" id="artifact-panel">
    <!-- Header -->
    <div class="artifact-header">
      <div class="artifact-header-left">
        <span class="artifact-icon">⚡</span>
        <span id="artifact-title">Artifact</span>
        <span class="artifact-format-badge" id="artifact-format-badge">HTML</span>
        
        <div class="viewer-tabs">
          <button class="viewer-tab active" id="tab-preview">Preview</button>
          <button class="viewer-tab" id="tab-source">Source Code</button>
        </div>
      </div>
      <button id="close-artifact" title="Close artifact">✕</button>
      <span class="artifact-actions">
        <span class="copy-confirm" id="copy-confirm">Copied!</span>
        <button class="artifact-action-btn" id="copy-artifact-btn" title="Copy HTML source to clipboard">Copy HTML</button>
        <button class="artifact-action-btn" id="download-artifact-btn" title="Download as .html file">↓ Download HTML</button>
      </span>
    </div>

    <!-- Tabbed body -->
    <div class="artifact-body">

      <!-- Rendered preview (default) -->
      <div class="artifact-content-panel" id="panel-preview">
        <div id="artifact-preview-wrap">
          <!-- empty / loading / error state -->
          <div class="artifact-state" id="artifact-preview-state">
            <span class="state-icon">📄</span>
            <span>No artifact yet</span>
          </div>
          <!-- actual iframe (hidden until content is ready) -->
          <iframe
            id="artifact-iframe"
            class="hidden"
            sandbox="allow-same-origin"
            title="Rendered artifact preview — sandboxed, no scripts"
          ></iframe>
        </div>
      </div>

      <!-- Source code -->
      <div class="artifact-content-panel hidden-tab" id="panel-source">
        <pre id="artifact-source"></pre>
      </div>

    </div>
  </aside>

</div>

<script>
  // ─── State ─────────────────────────────────────────────────────────────────
  const API = '/api/v1';
  let currentSessionId = null;
  let sessions = [];
  let currentArtifactHtml = null; // tracks the currently displayed artifact HTML (for download/copy)

  // ─── DOM refs ──────────────────────────────────────────────────────────────
  const messagesEl    = document.getElementById('messages');
  const msgInput      = document.getElementById('msg-input');
  const sendBtn       = document.getElementById('send-btn');
  const sessionList   = document.getElementById('session-list');
  const newSessionBtn = document.getElementById('new-session-btn');
  const providerBadge = document.getElementById('provider-badge');
  const artifactPanel = document.getElementById('artifact-panel');
  const artifactTitle = document.getElementById('artifact-title');
  const artifactFmtBadge = document.getElementById('artifact-format-badge');
  const artifactSource   = document.getElementById('artifact-source');
  const artifactIframe   = document.getElementById('artifact-iframe');
  
  const tabPreview = document.getElementById('tab-preview');
  const tabSource  = document.getElementById('tab-source');
  const panelPreview = document.getElementById('panel-preview');
  const panelSource  = document.getElementById('panel-source');

  const artifactPreviewState = document.getElementById('artifact-preview-state');
  const downloadBtn   = document.getElementById('download-artifact-btn');
  const copyBtn       = document.getElementById('copy-artifact-btn');
  const copyConfirm   = document.getElementById('copy-confirm');
  const statusBar     = document.getElementById('status-bar');

  // ─── Health / provider check ────────────────────────────────────────────────
  async function checkHealth() {
    try {
      const r = await fetch(`${API}/health`);
      if (!r.ok) return;
      const d = await r.json();
      const provider = d.provider || 'unknown';
      const model    = d.model || '';
      providerBadge.textContent = `${provider} · ${model}`;
    } catch (e) {
      providerBadge.textContent = 'backend offline';
    }
  }

  // ─── Sessions ───────────────────────────────────────────────────────────────
  async function createSession() {
    const r = await fetch(`${API}/sessions`, { method: 'POST' });
    const d = await r.json();
    const sid = d.session_id;
    sessions.unshift({ id: sid, created: new Date() });
    localStorage.setItem('lenny_session_id', sid);
    renderSessionList();
    switchSession(sid);
    return sid;
  }

  function renderSessionList() {
    sessionList.innerHTML = '';
    sessions.forEach((s, i) => {
      const el = document.createElement('div');
      el.className = 'session-item' + (s.id === currentSessionId ? ' active' : '');
      el.title = s.id;
      el.onclick = () => switchSession(s.id);

      const titleSpan = document.createElement('span');
      titleSpan.className = 'session-title';
      titleSpan.textContent = `Chat ${sessions.length - i}`;
      
      const delBtn = document.createElement('button');
      delBtn.className = 'delete-session-btn';
      delBtn.innerHTML = '🗑️';
      delBtn.title = 'Delete chat';
      delBtn.onclick = (e) => {
        e.stopPropagation();
        deleteSession(s.id);
      };
      
      el.appendChild(titleSpan);
      el.appendChild(delBtn);
      sessionList.appendChild(el);
    });
  }

  async function deleteSession(sid) {
    if (!confirm('Are you sure you want to delete this chat permanently?')) return;
    try {
      const r = await fetch(`${API}/sessions/${sid}`, { method: 'DELETE' });
      if (!r.ok) throw new Error('Failed to delete');
      
      sessions = sessions.filter(s => s.id !== sid);
      
      if (currentSessionId === sid) {
        currentSessionId = null;
        localStorage.removeItem('lenny_session_id');
        messagesEl.innerHTML = '';
        closeArtifact();
        // If there are other sessions left, switch to the first one, else create new
        if (sessions.length > 0) {
          switchSession(sessions[0].id);
        } else {
          createSession();
        }
      } else {
        renderSessionList();
      }
    } catch(e) {
      alert('Error deleting chat');
      console.error('Delete session error:', e);
    }
  }

  async function switchSession(sid) {
    currentSessionId = sid;
    renderSessionList();
    messagesEl.innerHTML = '';
    closeArtifact();
    // Load existing messages
    try {
      const r = await fetch(`${API}/sessions/${sid}/messages`);
      if (!r.ok) return;
      const d = await r.json();
      d.messages.forEach(m => renderMessage(m.role, m.content, m.sources || []));
    } catch (e) { /* no history */ }
  }

  // ─── Render message ─────────────────────────────────────────────────────────
  function renderMessage(role, content, sources = [], skillUsed = null, artifact = null) {
    const wrapper = document.createElement('div');
    wrapper.className = `msg ${role}`;

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    // For assistant messages, try to render Markdown
    if (role === 'assistant' && window.marked) {
      bubble.innerHTML = window.marked.parse(content);
    } else {
      bubble.textContent = content;
    }
    wrapper.appendChild(bubble);

    if (role === 'assistant') {
      // skill badge
      if (skillUsed) {
        const badge = document.createElement('div');
        badge.className = 'skill-badge';
        badge.textContent = skillUsed === 'ship30' ? '✍️ Ship 30 for 30' : '🔍 Grounded QA';
        wrapper.appendChild(badge);
      }

      // source chips
      if (sources && sources.length > 0) {
        const sourcesEl = document.createElement('div');
        sourcesEl.className = 'sources';
        sources.forEach(s => {
          const chip = document.createElement('span');
          chip.className = 'source-chip';
          const label = s.title || s.episode_id || s.chunk_id;
          chip.textContent = `📖 ${label}`;
          chip.title = `Distance: ${s.cosine_distance?.toFixed(3) || 'n/a'} | ${s.source_file || ''}`;
          sourcesEl.appendChild(chip);
        });
        wrapper.appendChild(sourcesEl);
      }

      // artifact button
      if (artifact) {
        const btn = document.createElement('button');
        btn.className = 'artifact-btn';
        btn.textContent = '⚡ View Artifact';
        btn.onclick = () => showArtifact(artifact);
        wrapper.appendChild(btn);
      }
    }

    messagesEl.appendChild(wrapper);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return wrapper;
  }

  // ─── Artifact viewer ────────────────────────────────────────────────────────
  /**
   * Security model:
   * - HTML is untrusted; rendered only inside a sandboxed iframe.
   * - sandbox="allow-same-origin" grants only document.cookie reads within the
   *   iframe's own origin. Because srcdoc iframes have a null/opaque origin
   *   different from the parent page, they CANNOT access:
   *     · parent window / DOM  (cross-origin barrier)
   *     · parent localStorage / sessionStorage
   *     · auth cookies scoped to the parent origin
   * - "allow-scripts" is NOT set → <script> tags are completely inert.
   * - "allow-top-navigation" is NOT set → links cannot redirect the parent.
   * - "allow-forms" is NOT set → form submission is blocked.
   */
  function _setPreviewState(type, msg) {
    artifactPreviewState.classList.remove('hidden', 'error');
    artifactIframe.classList.add('hidden');
    if (type === 'loading') {
      artifactPreviewState.innerHTML = '<div class="artifact-loading-bar"></div><span>Rendering…</span>';
    } else if (type === 'error') {
      artifactPreviewState.classList.add('error');
      artifactPreviewState.innerHTML = `<span class="state-icon">⚠️</span><span>${msg || 'Failed to render artifact'}</span>`;
    } else {
      artifactPreviewState.innerHTML = '<span class="state-icon">📄</span><span>No artifact yet</span>';
    }
  }

  function showArtifact(content) {
    if (!content || !content.trim()) {
      _setPreviewState('empty');
      return;
    }
    currentArtifactHtml = content; // save for download/copy
    artifactPanel.classList.remove('hidden');
    downloadBtn.disabled = false;
    copyBtn.disabled = false;

    const isHtml = /^\s*<!doctype|^\s*<html/i.test(content);
    artifactTitle.textContent = isHtml ? 'HTML Artifact' : 'Artifact';
    artifactFmtBadge.textContent = isHtml ? 'HTML' : 'Text';

    // ── Source panel: show raw code
    artifactSource.textContent = content;

    // Default to Preview tab
    tabPreview.classList.add('active');
    tabSource.classList.remove('active');
    panelPreview.classList.remove('hidden-tab');
    panelSource.classList.add('hidden-tab');

    // ── Preview panel: render in sandboxed iframe
    _setPreviewState('loading');
    try {
      // Use srcdoc for fully sandboxed rendering.
      // The iframe has sandbox="allow-same-origin" only.
      // Scripts are blocked; the artifact cannot reach the parent DOM.
      artifactIframe.srcdoc = content;
      artifactIframe.onload = () => {
        artifactPreviewState.classList.add('hidden');
        artifactIframe.classList.remove('hidden');
      };
      artifactIframe.onerror = () => _setPreviewState('error', 'Failed to load preview.');
    } catch (e) {
      _setPreviewState('error', e.message);
    }
  }

  function closeArtifact() {
    currentArtifactHtml = null;
    artifactPanel.classList.add('hidden');
    artifactSource.textContent = '';
    artifactIframe.classList.add('hidden');
    artifactIframe.srcdoc = '';
    downloadBtn.disabled = true;
    copyBtn.disabled = true;
    _setPreviewState('empty');
  }

  // ─── Artifact download/copy ──────────────────────────────────────────────

  /**
   * _slugify(text) — converts a title string to a safe lowercase filename slug.
   * e.g. "Why Product-Market Fit Matters" → "why-product-market-fit-matters"
   */
  function _slugify(text) {
    return text
      .toLowerCase()
      .replace(/[^a-z0-9\s-]/g, '')   // keep letters, digits, spaces, hyphens
      .trim()
      .replace(/\s+/g, '-')           // spaces → hyphens
      .replace(/-+/g, '-')            // collapse consecutive hyphens
      .slice(0, 80) || 'lenny-growth-artifact';
  }

  /**
   * _inferFilename(html) — extracts the <title> from the HTML doc, slugifies it.
   * Falls back to 'lenny-growth-artifact'.
   */
  function _inferFilename(html) {
    const match = html.match(/<title[^>]*>([^<]+)<\/title>/i);
    const title = match ? match[1].trim() : '';
    const slug = _slugify(title);
    return `${slug || 'lenny-growth-artifact'}.html`;
  }

  /**
   * downloadArtifact() — creates a Blob from the current artifact HTML,
   * triggers a browser download via a temporary object URL, then revokes the URL.
   * No backend call. The downloaded file contains only the artifact itself:
   * no tokens, cookies, session IDs, or internal app state.
   */
  function downloadArtifact() {
    if (!currentArtifactHtml) return;
    const filename = _inferFilename(currentArtifactHtml);
    const blob = new Blob([currentArtifactHtml], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    // Revoke the object URL after the browser has had time to start the download
    setTimeout(() => URL.revokeObjectURL(url), 60_000);
  }

  /**
   * copyArtifact() — copies the HTML source to the clipboard and shows a
   * brief "Copied!" confirmation that fades out after 2 seconds.
   */
  async function copyArtifact() {
    if (!currentArtifactHtml) return;
    try {
      await navigator.clipboard.writeText(currentArtifactHtml);
      copyConfirm.classList.add('visible');
      setTimeout(() => copyConfirm.classList.remove('visible'), 2000);
    } catch (e) {
      // Clipboard API unavailable (e.g. non-HTTPS) — silently ignore
    }
  }

  downloadBtn.onclick = downloadArtifact;
  copyBtn.onclick = copyArtifact;
  // Disable buttons initially (no artifact loaded yet)
  downloadBtn.disabled = true;
  copyBtn.disabled = true;

  document.getElementById('close-artifact').onclick = closeArtifact;

  // ─── Tab Switching ────────────────────────────────────────────────────────
  tabPreview.onclick = () => {
    tabPreview.classList.add('active');
    tabSource.classList.remove('active');
    panelPreview.classList.remove('hidden-tab');
    panelSource.classList.add('hidden-tab');
  };
  tabSource.onclick = () => {
    tabSource.classList.add('active');
    tabPreview.classList.remove('active');
    panelSource.classList.remove('hidden-tab');
    panelPreview.classList.add('hidden-tab');
  };

  // ─── Send message ────────────────────────────────────────────────────────────
  async function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || !currentSessionId) return;

    msgInput.value = '';
    msgInput.style.height = '42px';
    sendBtn.disabled = true;

    renderMessage('user', text);

    // Loading indicator
    const loadingEl = document.createElement('div');
    loadingEl.className = 'msg assistant';
    loadingEl.innerHTML = '<div class="bubble"><div class="loading-dots"><span></span><span></span><span></span></div></div>';
    messagesEl.appendChild(loadingEl);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    statusBar.textContent = 'Thinking...';

    try {
      const r = await fetch(`${API}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: currentSessionId }),
      });

      loadingEl.remove();

      if (!r.ok) {
        const err = await r.json().catch(() => ({}));
        renderMessage('assistant', `⚠️ Error: ${err?.error?.message || r.statusText}`);
        return;
      }

      const d = await r.json();

      renderMessage('assistant', d.answer, d.sources || [], d.skill_used, d.artifact);

      // Update provider badge live
      if (d.provider && d.model) {
        providerBadge.textContent = `${d.provider} · ${d.model}`;
      }

      // Auto-open artifact
      if (d.artifact) {
        showArtifact(d.artifact, d.skill_used);
      }

      statusBar.textContent = d.retrieval_count > 0
        ? `${d.retrieval_count} source(s) · ${d.latency_ms}ms`
        : `${d.latency_ms}ms`;

    } catch (e) {
      loadingEl.remove();
      renderMessage('assistant', `⚠️ Network error: ${e.message}`);
    } finally {
      sendBtn.disabled = false;
      msgInput.focus();
    }
  }

  // ─── Event listeners ────────────────────────────────────────────────────────
  sendBtn.onclick = sendMessage;

  msgInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  msgInput.addEventListener('input', () => {
    msgInput.style.height = '42px';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
  });

  newSessionBtn.onclick = () => createSession();

  // ─── Init ────────────────────────────────────────────────────────────────────
  (async function init() {
    await checkHealth();
    const storedSid = localStorage.getItem('lenny_session_id');
    if (storedSid) {
      try {
        const r = await fetch(`${API}/sessions/${storedSid}`);
        if (r.ok) {
          sessions.unshift({ id: storedSid, created: new Date() });
          await switchSession(storedSid);
          return;
        }
      } catch (e) {
        // Fallback to creating a new one if network error or 404
      }
    }
    await createSession();
  })();
</script>
</body>
